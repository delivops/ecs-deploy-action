# A whole secret as one environment variable: a secrets_envs entry with `env`.
# The secret's ARN is used with no JSON-key suffix, so the container gets the
# entire secret string - use it for single-value (non-JSON) secrets.
cpu: 256
memory: 512
port: 8080

secrets_envs:
  # JSON secret: one variable per listed key (unchanged)
  - id: arn:aws:secretsmanager:us-east-1:123456789012:secret:app-secrets-abc123
    values:
      - DATABASE_URL
  # Single-value secret: the whole string as STRIPE_API_KEY
  - id: arn:aws:secretsmanager:us-east-1:123456789012:secret:stripe-api-key-AbCdEf
    env: STRIPE_API_KEY

role_arn: arn:aws:iam::123456789012:role/my-app
