# Secrets from SSM Parameter Store, next to Secrets Manager ones.
# An SSM parameter ARN is passed through as the secret's valueFrom unchanged;
# a Secrets Manager ARN gets the env var name appended as the JSON key.
cpu: 256
memory: 512
port: 8080

secrets:
  - DB_PASSWORD: arn:aws:secretsmanager:us-east-1:123456789012:secret:prod-db-password
  - API_TOKEN: arn:aws:ssm:us-east-1:123456789012:parameter/my-app/api-token
  - LICENSE_KEY: arn:aws:ssm:us-east-1:123456789012:parameter/shared/license-key

role_arn: arn:aws:iam::123456789012:role/my-app
