name: app
replica_count: 2
cpu: 512
memory: 1024
cpu_arch: ARM64
role_arn: arn:aws:iam::123456789012:role/ecsTaskExecutionRole
secrets: 
  - CLIENT_ID: arn:aws:secretsmanager::secret:ava-cortex-analyst-production-IhUQht
  - CLIENT_NAME: arn:aws:secretsmanager::secret:ava-cortex-analyst-production-IhUQht
envs:
  - NODE_ENV: production
  - API_KEY: xyz123
port: 8080
command: ["hello"]
entrypoint: ["world"]


# All eight positional arguments are required; an empty container_registry (5th) leaves the
# main image unprefixed, which is what this example demonstrates:
# run: python3 scripts/generate_task_def.py examples/public-image.yaml my-cluster us-east-1 \
#        123456789012.dkr.ecr.us-east-1.amazonaws.com "" dummy-image dummy-tag my-service
