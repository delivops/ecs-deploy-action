# Deliberately no task role.
#
# terraform-aws-ecs-service permits task_role = {}, which creates no role and
# publishes no SSM parameter. The literal string "none" says "omit this key" so
# the deploy does not fail looking for a role that was never meant to exist.
#
# Note the difference from YAML null: null deletes the key during a
# services_overrides merge, which means "fall through to role_arn, then SSM".
# Only "none" means "no role at all".
cpu: 256
memory: 512
port: 8080
task_role_arn: none
execution_role_arn: arn:aws:iam::123456789012:role/my-cluster_my-service_execution
envs:
  - LOG_LEVEL: info
