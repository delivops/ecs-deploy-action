name: Test and Update Expected Outputs

on:
  pull_request:

jobs:
  test-and-update:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
      with:
        # Fetch the full history to allow for commits
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run role resolution tests
      run: python tests/test_roles.py

    - name: Run tests and update expected outputs
      run: python tests/test.py
      env:
        # Allow this pass to regenerate expected outputs so the auto-commit step
        # below can pick them up. The final gate re-runs without this, so a
        # golden file that is missing from the PR still fails the build.
        UPDATE_EXPECTED: '1'

    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@v7
      id: auto_commit
      with:
        commit_message: |
          Update expected outputs from test run
          
          Auto-generated by GitHub Actions on PR #${{ github.event.number }}
        file_pattern: 'tests/expected_outputs/*.json'

    - name: Comment on PR if outputs were updated
      if: steps.auto_commit.outputs.changes_detected == 'true'
      uses: actions/github-script@v9
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '🤖 **Expected outputs updated**\n\nThe test run detected changes and automatically updated the expected output files. Please review the changes in the latest commit.'
          })

    - name: Fail if tests failed
      run: |
        # Re-run tests to ensure they pass after any updates. Deliberately
        # without UPDATE_EXPECTED, so a missing expected output is a failure
        # rather than something the runner quietly fabricates.
        python tests/test.py
        python tests/test_roles.py
