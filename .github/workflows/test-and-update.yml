name: Test and Update Expected Outputs

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-update:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        # Fetch the full history to allow for commits
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run unit tests
      run: pytest tests/test_unit.py

    - name: Run role resolution tests
      run: python tests/test_roles.py

    - name: Run task definition tests
      # Deliberately without UPDATE_EXPECTED, so a missing expected output fails
      # the build instead of being fabricated here and auto-committed - which
      # would let a newly added example pass without ever being checked against
      # anything. To add an example, run this locally with UPDATE_EXPECTED=1 and
      # commit the generated file after reviewing it.
      run: python tests/test.py

    - name: Commit and push changes
      # Forked-PR runs get a read-only GITHUB_TOKEN and cannot push, which would
      # fail the job for outside contributors. Only auto-commit for same-repo PRs.
      if: github.event.pull_request.head.repo.full_name == github.repository
      uses: stefanzweifel/git-auto-commit-action@v7
      id: auto_commit
      with:
        commit_message: |
          Update expected outputs from test run
          
          Auto-generated by GitHub Actions on PR #${{ github.event.number }}
        file_pattern: 'tests/expected_outputs/*.json'

    - name: Comment on PR if outputs were updated
      if: steps.auto_commit.outputs.changes_detected == 'true'
      uses: actions/github-script@v9
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '🤖 **Expected outputs updated**\n\nThe test run detected changes and automatically updated the expected output files. Please review the changes in the latest commit.'
          })

    - name: Fail if tests failed
      run: |
        # Re-run to ensure everything still passes after any auto-committed update.
        python tests/test.py
        python tests/test_roles.py
