name: 'ECS Deploy Action'
description: 'Deploy an application to Amazon ECS using a simplified YAML configuration'

inputs:
  environment:
    description: 'The environment to deploy to'
    required: true
  deployment_type:
    description: 'Deployment type: service, scheduled_task, or triggerable_task'
    default: 'service'
    required: false
  ecs_service:
    description: 'The name of the ECS service (required when deployment_type=service)' 
    required: false
  task_name:
    description: 'The name of the task (required when deployment_type=scheduled_task or triggerable_task)'
    required: false
  image_name:
    description: 'The name of the Docker image'
    required: true
  tag:
    description: 'The tag of the Docker image'
    required: true
  task_config_yaml:
    description: 'Path to the YAML file containing task configuration'
    required: true
  aws_account_id:
    description: 'The AWS account ID'
    required: true
  aws_region:
    description: 'The AWS region'
    required: true
  ecs_cluster:
    description: 'The name of the ECS cluster'
    required: true
  aws_role:
    description: 'The AWS IAM role to assume'
    default: 'github_services'
    required: false
  dry_run:
    description: 'Whether to perform a dry run'
    default: 'false'
    required: false
  propagate_tags:
    description: 'Where the service copies tags from when launching tasks (service mode only). Set to SERVICE so Terraform-managed service tags propagate to tasks; use NONE to disable.'
    default: 'SERVICE'
    required: false
  ecr_registry:
    description: "Whether the main application image lives in the account's ECR registry. Set to 'true' (default) to prefix the image with the ECR registry URL; set to 'false' for a public/external image. OTEL and Fluent Bit sidecars always use ECR regardless of this flag."
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: "arn:aws:iam::${{ inputs.aws_account_id }}:role/${{ inputs.aws_role }}"
        aws-region: ${{ inputs.aws_region }}

    - id: login_ecr
      uses: aws-actions/amazon-ecr-login@v2
    - id: define-registry
      env:
        ECR_REGISTRY: ${{ steps.login_ecr.outputs.registry }}
        USE_ECR_REGISTRY: ${{ inputs.ecr_registry }}
      run: |
        # Always set registry for OTEL/Fluent Bit (they're always ECR)
        echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"

        # Set container_registry only if ecr_registry is true (for main app)
        if [ "$USE_ECR_REGISTRY" == "true" ]; then
          echo "container_registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"
        else
          echo "container_registry=" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - id: install_dependencies
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python3 -m pip install -r "$ACTION_PATH/requirements.txt"
      shell: bash

    - id: determine-name
      env:
        DEPLOYMENT_TYPE: ${{ inputs.deployment_type }}
        TASK_NAME: ${{ inputs.task_name }}
        ECS_SERVICE: ${{ inputs.ecs_service }}
      run: |
        if [ "$DEPLOYMENT_TYPE" == "scheduled_task" ] || [ "$DEPLOYMENT_TYPE" == "triggerable_task" ]; then
          echo "name=$TASK_NAME" >> "$GITHUB_OUTPUT"
        else
          echo "name=$ECS_SERVICE" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - id: generate-task-def
      env:
        ACTION_PATH: ${{ github.action_path }}
        TASK_CONFIG_YAML: ${{ inputs.task_config_yaml }}
        ECS_CLUSTER: ${{ inputs.ecs_cluster }}
        AWS_REGION: ${{ inputs.aws_region }}
        REGISTRY: ${{ steps.define-registry.outputs.registry }}
        CONTAINER_REGISTRY: ${{ steps.define-registry.outputs.container_registry }}
        IMAGE_NAME: ${{ inputs.image_name }}
        TAG: ${{ inputs.tag }}
        DEPLOY_NAME: ${{ steps.determine-name.outputs.name }}
      run: |
        python3 "$ACTION_PATH/scripts/generate_task_def.py" \
          "$TASK_CONFIG_YAML" \
          "$ECS_CLUSTER" \
          "$AWS_REGION" \
          "$REGISTRY" \
          "$CONTAINER_REGISTRY" \
          "$IMAGE_NAME" \
          "$TAG" \
          "$DEPLOY_NAME"
      shell: bash

    # ECS Service Deployment
    - uses: aws-actions/amazon-ecs-deploy-task-definition@v2.6.1
      if: ${{ inputs.deployment_type == 'service' && inputs.dry_run == 'false' }}
      id: ecs-deploy-service
      with:
        task-definition: task-definition.json
        service: ${{ inputs.ecs_service }}
        cluster: ${{ inputs.ecs_cluster }}
        desired-count: ${{ steps.generate-task-def.outputs.replica_count }}
        wait-for-service-stability: true
        # Preserve the Terraform-managed propagate_tags setting on the service.
        # amazon-ecs-deploy-task-definition always sends propagateTags in its
        # UpdateService call; when unset AWS treats it as NONE and silently resets
        # the service, wiping Terraform's SERVICE setting so tasks stop inheriting tags.
        propagate-tags: ${{ inputs.propagate_tags }}
        
    - id: check-service-deployment
      if: ${{ inputs.deployment_type == 'service' && inputs.dry_run == 'false' }}
      env:
        ECS_CLUSTER: ${{ inputs.ecs_cluster }}
        ECS_SERVICE: ${{ inputs.ecs_service }}
        NEW_TASK_DEF_ARN: ${{ steps.ecs-deploy-service.outputs.task-definition-arn }}
      run: |
         CURRENT_TASK_DEF_ARN=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" --query 'services[0].deployments[0].taskDefinition' --output text)
         echo "Current task arn: $CURRENT_TASK_DEF_ARN"
         echo "New task arn: $NEW_TASK_DEF_ARN"
         if [ "$CURRENT_TASK_DEF_ARN" != "$NEW_TASK_DEF_ARN" ]; then
           echo "Deployment failed."
           exit 1
         fi
      shell: bash

    # Scheduled Task / Triggerable Task Deployment
    - id: register-task-def
      if: ${{ (inputs.deployment_type == 'scheduled_task' || inputs.deployment_type == 'triggerable_task') && inputs.dry_run == 'false' }}
      run: |
        # Register the new task definition
        TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://task-definition.json \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)
        echo "task_definition_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
        echo "New task definition: $TASK_DEF_ARN"
      shell: bash

    - id: update-eventbridge-target
      if: ${{ inputs.deployment_type == 'scheduled_task' && inputs.dry_run == 'false' }}
      env:
        ECS_CLUSTER: ${{ inputs.ecs_cluster }}
        TASK_NAME: ${{ inputs.task_name }}
        NEW_TASK_DEF_ARN: ${{ steps.register-task-def.outputs.task_definition_arn }}
      run: |
        set -euo pipefail
        # Construct EventBridge rule name using same pattern as Terraform
        EVENT_RULE_NAME="${ECS_CLUSTER}-${TASK_NAME}"

        echo "Using EventBridge rule: $EVENT_RULE_NAME"

        # Get current target configuration
        CURRENT_TARGETS=$(aws events list-targets-by-rule \
          --rule "$EVENT_RULE_NAME" \
          --query 'Targets[0]')

        if [ -z "$CURRENT_TARGETS" ] || [ "$CURRENT_TARGETS" == "null" ]; then
          echo "❌ No existing target found for EventBridge rule $EVENT_RULE_NAME" >&2
          exit 1
        fi

        # Update only the TaskDefinitionArn, keeping all other config
        UPDATED_TARGETS=$(echo "$CURRENT_TARGETS" | jq \
          --arg new_arn "$NEW_TASK_DEF_ARN" \
          '.EcsParameters.TaskDefinitionArn = $new_arn')

        # Put the updated target back
        aws events put-targets \
          --rule "$EVENT_RULE_NAME" \
          --targets "$UPDATED_TARGETS"

        echo "✅ Updated EventBridge rule $EVENT_RULE_NAME to task definition $NEW_TASK_DEF_ARN"
      shell: bash
