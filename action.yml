name: 'ECS Deploy Action'
description: 'Deploy an application to Amazon ECS using a simplified YAML configuration'

inputs:
  environment:
    description: 'The environment to deploy to'
    required: true
  deployment_type:
    description: 'Deployment type: service, scheduled_task, triggerable_task, or batch_job_definition (registers an AWS Batch job definition revision)'
    default: 'service'
    required: false
  ecs_service:
    description: 'The name of the ECS service (required when deployment_type=service)' 
    required: false
  task_name:
    description: 'The name of the task (required when deployment_type=scheduled_task or triggerable_task); the job definition name for batch_job_definition'
    required: false
  image_name:
    description: 'The name of the Docker image'
    required: true
  tag:
    description: 'The tag of the Docker image'
    required: true
  task_config_yaml:
    description: 'Path to the YAML file containing task configuration (required when task_definition_source=yaml)'
    required: false
  task_definition_source:
    description: 'Where the task definition comes from: yaml (task_config_yaml, the default) or template (the service''s Terraform-managed template family, published to SSM by terraform-aws-ecs-service >= 3.2.0 task_definition_template). Template mode supports deployment_type=service and batch_job_definition (the template job definition named in SSM /batch/<task_name>/job-definition-template).'
    default: 'yaml'
    required: false
  container_name:
    description: 'Template mode with deployment_type=service only: the container whose image this deploy replaces'
    default: 'app'
    required: false
  deregister_previous:
    description: 'Template mode with deployment_type=batch_job_definition only: deregister older ACTIVE revisions after registering (in YAML mode set deregister_previous in the YAML)'
    default: 'false'
    required: false
  aws_account_id:
    description: 'The AWS account ID'
    required: true
  aws_region:
    description: 'The AWS region'
    required: true
  ecs_cluster:
    description: 'The name of the ECS cluster. Required for service, scheduled_task and triggerable_task; not used by batch_job_definition'
    required: false
  aws_role:
    description: 'The AWS IAM role to assume'
    default: 'github_services'
    required: false
  dry_run:
    description: 'Whether to perform a dry run'
    default: 'false'
    required: false
  propagate_tags:
    description: 'Where the service copies tags from when launching tasks (service mode only). Set to SERVICE so Terraform-managed service tags propagate to tasks; use NONE to disable.'
    default: 'SERVICE'
    required: false
  ecr_registry:
    description: 'The ECR registry URL'
    required: false
    default: 'true'

outputs:
  job_definition_arn:
    description: 'batch_job_definition only: ARN of the registered job definition revision (empty on dry_run)'
    value: ${{ steps.register-job-def.outputs.job_definition_arn }}

runs:
  using: "composite"
  steps:
    # Only for non-default sources, so YAML callers run no new step. Fails before any AWS call.
    - id: validate-inputs
      if: ${{ inputs.task_definition_source != 'yaml' }}
      env:
        SOURCE: ${{ inputs.task_definition_source }}
        TASK_CONFIG_YAML: ${{ inputs.task_config_yaml }}
        DEPLOYMENT_TYPE: ${{ inputs.deployment_type }}
      run: |
        if [ "$SOURCE" != "template" ]; then
          echo "::error::task_definition_source must be 'yaml' or 'template', got '$SOURCE'"
          exit 1
        fi
        if [ -n "$TASK_CONFIG_YAML" ]; then
          echo "::error::task_config_yaml is not used with task_definition_source=template; remove it (the task definition comes from the Terraform-managed template)"
          exit 1
        fi
        if [ "$DEPLOYMENT_TYPE" != "service" ] && [ "$DEPLOYMENT_TYPE" != "batch_job_definition" ]; then
          echo "::error::task_definition_source=template supports deployment_type=service or batch_job_definition only, got '$DEPLOYMENT_TYPE'"
          exit 1
        fi
      shell: bash

    # batch_job_definition only, so the other types run no new step.
    - id: validate-batch-inputs
      if: ${{ inputs.deployment_type == 'batch_job_definition' }}
      env:
        SOURCE: ${{ inputs.task_definition_source }}
        TASK_CONFIG_YAML: ${{ inputs.task_config_yaml }}
        TASK_NAME: ${{ inputs.task_name }}
        DEREGISTER_PREVIOUS: ${{ inputs.deregister_previous }}
      run: |
        # validate-inputs has already rejected any source other than yaml/template,
        # and task_config_yaml together with template.
        if [ "$SOURCE" == "yaml" ] && [ -z "$TASK_CONFIG_YAML" ]; then
          echo "::error::task_config_yaml is required for deployment_type=batch_job_definition"
          exit 1
        fi
        if [ "$SOURCE" == "yaml" ] && [ "$DEREGISTER_PREVIOUS" != "false" ]; then
          echo "::error::the deregister_previous input is for task_definition_source=template; in YAML mode set deregister_previous in the YAML"
          exit 1
        fi
        if [ "$DEREGISTER_PREVIOUS" != "true" ] && [ "$DEREGISTER_PREVIOUS" != "false" ]; then
          echo "::error::deregister_previous must be 'true' or 'false', got '$DEREGISTER_PREVIOUS'"
          exit 1
        fi
        if [ -z "$TASK_NAME" ]; then
          echo "::error::task_name (the job definition name) is required for deployment_type=batch_job_definition"
          exit 1
        fi
      shell: bash

    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: "arn:aws:iam::${{ inputs.aws_account_id }}:role/${{ inputs.aws_role }}"
        aws-region: ${{ inputs.aws_region }}

    - id: login_ecr
      uses: aws-actions/amazon-ecr-login@v2
    - id: define-registry
      run: |
        # Always set registry for OTEL/Fluent Bit (they're always ECR)
        echo "registry=${{ steps.login_ecr.outputs.registry }}" >> $GITHUB_OUTPUT
        
        # Set container_registry only if ecr_registry is true (for main app)
        if [ "${{ inputs.ecr_registry }}" == "true" ]; then
          echo "container_registry=${{ steps.login_ecr.outputs.registry }}" >> $GITHUB_OUTPUT
        else
          echo "container_registry=" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - id: install_dependencies
      run: |
        python3 -m pip install -r ${{ github.action_path }}/requirements.txt
      shell: bash

    - id: determine-name
      run: |
        if [ "${{ inputs.deployment_type }}" == "scheduled_task" ] || [ "${{ inputs.deployment_type }}" == "triggerable_task" ] || [ "${{ inputs.deployment_type }}" == "batch_job_definition" ]; then
          echo "name=${{ inputs.task_name }}" >> $GITHUB_OUTPUT
        else
          echo "name=${{ inputs.ecs_service }}" >> $GITHUB_OUTPUT
        fi
      shell: bash

    - id: generate-task-def
      if: ${{ inputs.task_definition_source == 'yaml' && inputs.deployment_type != 'batch_job_definition' }}
      run: |
        python3 ${{ github.action_path }}/scripts/generate_task_def.py \
          "${{ inputs.task_config_yaml }}" \
          "${{ inputs.ecs_cluster }}" \
          "${{ inputs.aws_region }}" \
          "${{ steps.define-registry.outputs.registry }}" \
          "${{ steps.define-registry.outputs.container_registry }}" \
          "${{ inputs.image_name }}" \
          "${{ inputs.tag }}" \
          "${{ steps.determine-name.outputs.name }}"
      shell: bash

    - id: generate-job-def
      if: ${{ inputs.task_definition_source == 'yaml' && inputs.deployment_type == 'batch_job_definition' }}
      env:
        TASK_CONFIG_YAML: ${{ inputs.task_config_yaml }}
        JOB_NAME: ${{ inputs.task_name }}
        REGION: ${{ inputs.aws_region }}
        CONTAINER_REGISTRY: ${{ steps.define-registry.outputs.container_registry }}
        IMAGE_NAME: ${{ inputs.image_name }}
        TAG: ${{ inputs.tag }}
      run: |
        python3 ${{ github.action_path }}/scripts/generate_job_def.py \
          "$TASK_CONFIG_YAML" "$JOB_NAME" "$REGION" "$CONTAINER_REGISTRY" "$IMAGE_NAME" "$TAG"
      shell: bash

    - id: template-task-def
      if: ${{ inputs.task_definition_source == 'template' && inputs.deployment_type == 'service' }}
      env:
        CLUSTER: ${{ inputs.ecs_cluster }}
        REGION: ${{ inputs.aws_region }}
        CONTAINER_REGISTRY: ${{ steps.define-registry.outputs.container_registry }}
        IMAGE_NAME: ${{ inputs.image_name }}
        TAG: ${{ inputs.tag }}
        SERVICE: ${{ steps.determine-name.outputs.name }}
        CONTAINER_NAME: ${{ inputs.container_name }}
      run: |
        python3 ${{ github.action_path }}/scripts/template_task_def.py \
          "$CLUSTER" "$REGION" "$CONTAINER_REGISTRY" "$IMAGE_NAME" "$TAG" "$SERVICE" \
          --container-name "$CONTAINER_NAME"
      shell: bash

    - id: template-job-def
      if: ${{ inputs.task_definition_source == 'template' && inputs.deployment_type == 'batch_job_definition' }}
      env:
        REGION: ${{ inputs.aws_region }}
        CONTAINER_REGISTRY: ${{ steps.define-registry.outputs.container_registry }}
        IMAGE_NAME: ${{ inputs.image_name }}
        TAG: ${{ inputs.tag }}
        JOB_NAME: ${{ inputs.task_name }}
        DEREGISTER_PREVIOUS: ${{ inputs.deregister_previous }}
      run: |
        python3 ${{ github.action_path }}/scripts/template_job_def.py \
          "$REGION" "$CONTAINER_REGISTRY" "$IMAGE_NAME" "$TAG" "$JOB_NAME" \
          --deregister-previous "$DEREGISTER_PREVIOUS"
      shell: bash

    # ECS Service Deployment
    - uses: aws-actions/amazon-ecs-deploy-task-definition@v2.6.1
      if: ${{ inputs.deployment_type == 'service' && inputs.dry_run == 'false' }}
      id: ecs-deploy-service
      with:
        task-definition: task-definition.json
        service: ${{ inputs.ecs_service }}
        cluster: ${{ inputs.ecs_cluster }}
        # Empty leaves the service's desired count alone. For YAML callers this is exactly the old expression.
        desired-count: ${{ inputs.task_definition_source == 'template' && steps.template-task-def.outputs.replica_count || steps.generate-task-def.outputs.replica_count }}
        wait-for-service-stability: true
        # Preserve the Terraform-managed propagate_tags setting on the service.
        # amazon-ecs-deploy-task-definition always sends propagateTags in its
        # UpdateService call; when unset AWS treats it as NONE and silently resets
        # the service, wiping Terraform's SERVICE setting so tasks stop inheriting tags.
        propagate-tags: ${{ inputs.propagate_tags }}
        
    - id: check-service-deployment
      if: ${{ inputs.deployment_type == 'service' && inputs.dry_run == 'false' }}
      run: |
         CURRENT_TASK_DEF_ARN=$(aws ecs describe-services --cluster ${{ inputs.ecs_cluster }} --services ${{ inputs.ecs_service }} --query services[0].deployments[0].taskDefinition | jq -r ".")
         NEW_TASK_DEF_ARN=${{ steps.ecs-deploy-service.outputs.task-definition-arn }}
         echo "Current task arn: $CURRENT_TASK_DEF_ARN"
         echo "New task arn: $NEW_TASK_DEF_ARN"
         if [ "$CURRENT_TASK_DEF_ARN" != "$NEW_TASK_DEF_ARN" ]; then
           echo "Deployment failed."
           exit 1
         fi
      shell: bash

    # Scheduled Task / Triggerable Task Deployment
    - id: register-task-def
      if: ${{ (inputs.deployment_type == 'scheduled_task' || inputs.deployment_type == 'triggerable_task') && inputs.dry_run == 'false' }}
      run: |
        # Register the new task definition
        TASK_DEF_ARN=$(aws ecs register-task-definition \
          --cli-input-json file://task-definition.json \
          --query 'taskDefinition.taskDefinitionArn' \
          --output text)
        echo "task_definition_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT
        echo "New task definition: $TASK_DEF_ARN"
      shell: bash

    - id: update-eventbridge-target
      if: ${{ inputs.deployment_type == 'scheduled_task' && inputs.dry_run == 'false' }}
      run: |
        # Construct EventBridge rule name using same pattern as Terraform
        EVENT_RULE_NAME="${{ inputs.ecs_cluster }}-${{ inputs.task_name }}"
        
        echo "Using EventBridge rule: $EVENT_RULE_NAME"
        
        # Get current target configuration
        CURRENT_TARGETS=$(aws events list-targets-by-rule \
          --rule "$EVENT_RULE_NAME" \
          --query 'Targets[0]')
        
        # Update only the TaskDefinitionArn, keeping all other config
        UPDATED_TARGETS=$(echo $CURRENT_TARGETS | jq \
          --arg new_arn "${{ steps.register-task-def.outputs.task_definition_arn }}" \
          '.EcsParameters.TaskDefinitionArn = $new_arn')
        
        # Put the updated target back
        aws events put-targets \
          --rule "$EVENT_RULE_NAME" \
          --targets "$UPDATED_TARGETS"
        
        echo "✅ Updated EventBridge rule $EVENT_RULE_NAME to task definition ${{ steps.register-task-def.outputs.task_definition_arn }}"
      shell: bash

    # AWS Batch job definition
    - id: register-job-def
      if: ${{ inputs.deployment_type == 'batch_job_definition' && inputs.dry_run == 'false' }}
      env:
        JOB_NAME: ${{ inputs.task_name }}
        # Only one of the two steps runs; a skipped step's output is empty.
        DEREGISTER_PREVIOUS: ${{ steps.generate-job-def.outputs.deregister_previous || steps.template-job-def.outputs.deregister_previous }}
      run: |
        JOB_DEF_ARN=$(aws batch register-job-definition \
          --cli-input-json file://job-definition.json \
          --query 'jobDefinitionArn' \
          --output text)
        echo "job_definition_arn=$JOB_DEF_ARN" >> "$GITHUB_OUTPUT"
        echo "New job definition: $JOB_DEF_ARN"

        # Off by default: a running or queued job keeps the revision it was
        # submitted with, and deregistering it does not stop the job either way.
        if [ "$DEREGISTER_PREVIOUS" == "true" ]; then
          PREVIOUS=$(aws batch describe-job-definitions \
            --job-definition-name "$JOB_NAME" \
            --status ACTIVE \
            --query "jobDefinitions[?jobDefinitionArn!='$JOB_DEF_ARN'].jobDefinitionArn" \
            --output text)
          for ARN in $PREVIOUS; do
            aws batch deregister-job-definition --job-definition "$ARN"
            echo "Deregistered previous revision: $ARN"
          done
        fi
      shell: bash
